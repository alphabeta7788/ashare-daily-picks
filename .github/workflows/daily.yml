name: Daily A-share Picks Update

on:
  schedule:
    - cron: '0 1 * * *'  # 北京 9:00 = UTC 01:00
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install deps
        run: pip install -r requirements.txt

      - name: 00 Fetch universe
        run: python scripts/00_universe.py

      # Restore bars cache (committed in repo) → data/ashare/
      - name: Restore bars cache
        run: |
          mkdir -p data/ashare
          if [ -f scripts/all_a_share_bars.parquet ]; then
            cp scripts/all_a_share_bars.parquet data/ashare/all_a_share_bars.parquet
            echo "Cached bars restored: $(du -h data/ashare/all_a_share_bars.parquet)"
          fi

      # Incremental download — fetches only new dates since cached max
      - name: 01 Download bars (INCREMENTAL)
        run: python scripts/01_download.py --workers 6 --safety-overlap-days 5

      # Save cache back to repo
      - name: Persist bars cache
        run: cp data/ashare/all_a_share_bars.parquet scripts/all_a_share_bars.parquet

      - name: 02 Generate daily picks (STAR-evolved)
        run: |
          if [ -f scripts/star_picker_winner.py ]; then
            cp scripts/star_picker_winner.py data/ashare/star_picker_winner.py
            python scripts/02_picks_star.py
          else
            python scripts/02_picks.py --top-k 3
          fi

      - name: 03 Generate M&A targets
        run: python scripts/03_ma.py --top-k 10

      - name: 05 Shadow simulator (incremental update)
        run: |
          if [ -f scripts/shadow_portfolio.parquet ]; then
            cp scripts/shadow_portfolio.parquet data/ashare/shadow_portfolio.parquet
          fi
          python scripts/05_shadow_update.py update
          cp data/ashare/shadow_portfolio.parquet scripts/shadow_portfolio.parquet

      - name: 06 Render shadow performance panel
        run: python scripts/06_shadow_panel.py

      - name: 04 Render webpage
        run: python scripts/04_render.py

      - name: Copy to index.html
        run: cp viz/daily_picks.html index.html

      - name: Commit + push if changed (rebase-safe)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html scripts/all_a_share_bars.parquet scripts/shadow_portfolio.parquet
          if git diff --cached --quiet; then
            echo "no changes — nothing to commit"
            exit 0
          fi
          DATE=$(date -u +'%Y-%m-%d %H:%M UTC')
          git commit -m "Auto update $DATE (incremental bars + shadow)"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            echo "push attempt $i failed; sleeping 5s"
            sleep 5
          done
          exit 1
